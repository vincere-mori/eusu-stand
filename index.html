<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стенд ЭУСУ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* лабораторный журнал на миллиметровке: синие чернила, красный карандаш проверяющего, каналы осциллографа */
:root {
  --paper: #eef2ef;
  --card: #f9fbfa;
  --grid: #d5dfd9;
  --grid2: #e3eae6;
  --ink: #17324d;
  --muted: #5a6b72;
  --line: #c3d0c9;
  --ch1: #2160c4;
  --ch2: #d0462c;
  --ch3: #1f8a5b;
  --pencil: #c2362b;
  --ok: #2b7a4b;
  --amber: #b9770e;
  --chip: #e2ebe6;
  --f-display: "Unbounded", "Trebuchet MS", sans-serif;
  --f-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f171b; --card: #162127; --grid: #23323a; --grid2: #1b282f; --ink: #dbe7ea;
    --muted: #8ea2aa; --line: #2c3f48; --ch1: #6aa5ff; --ch2: #ff8061; --ch3: #4cc38a;
    --pencil: #ff6b5e; --ok: #4cc38a; --amber: #e0a73a; --chip: #1f2e35; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f171b; --card: #162127; --grid: #23323a; --grid2: #1b282f; --ink: #dbe7ea;
  --muted: #8ea2aa; --line: #2c3f48; --ch1: #6aa5ff; --ch2: #ff8061; --ch3: #4cc38a;
  --pencil: #ff6b5e; --ok: #4cc38a; --amber: #e0a73a; --chip: #1f2e35; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper);
  background-image: linear-gradient(var(--grid2) 1px, transparent 1px), linear-gradient(90deg, var(--grid2) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 1080px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ch1); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* шапка */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 0;
}
@media (max-width: 600px) { header.top { position: static; } }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.brand { display: flex; align-items: baseline; gap: 10px; cursor: pointer; background: none; border: 0; padding: 0; }
.brand h1 { font-size: 20px; }
.brand span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.stats { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.stat { font-family: var(--f-mono); font-size: 12px; background: var(--chip); border-radius: 4px; padding: 4px 8px; }
.stat b { font-weight: 600; }
.navbtn { border: 1px solid var(--line); background: var(--card); border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.navbtn:hover { border-color: var(--ink); }

/* карта */
.hero { padding: 28px 0 8px; display: grid; gap: 10px; }
.hero h2 { font-size: clamp(26px, 5vw, 42px); line-height: 1.08; max-width: 18ch; }
.hero p { margin: 0; max-width: 62ch; color: var(--muted); }
.benches { display: grid; gap: 10px; margin-top: 20px; }
.bench {
  display: grid; grid-template-columns: 76px 1fr auto; gap: 16px; align-items: center;
  background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; cursor: pointer; text-align: left;
}
.bench:hover { border-color: var(--ink); }
.bench .no { font-family: var(--f-display); font-size: 24px; color: var(--ch1); }
.bench .no small { display: block; font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.bench h3 { font-size: 16px; }
.bench p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.meter { display: flex; gap: 4px; align-items: center; }
.meter i { width: 14px; height: 14px; border: 1.5px solid var(--line); border-radius: 50%; }
.meter i.on { background: var(--amber); border-color: var(--amber); }
.stamp {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ok); border: 1.5px solid var(--ok); border-radius: 3px; padding: 2px 6px; transform: rotate(-4deg); display: inline-block;
}
.exam-card {
  margin-top: 16px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
  border: 2px dashed var(--pencil); border-radius: 6px; padding: 16px; background: var(--card);
}
.exam-card h3 { color: var(--pencil); }
.exam-card p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.btn {
  border: 0; background: var(--ink); color: var(--paper); border-radius: 4px; padding: 10px 16px; cursor: pointer; font-weight: 600;
}
.btn.red { background: var(--pencil); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: .45; cursor: default; }

/* лаба */
.labhead { padding: 22px 0 12px; display: grid; gap: 6px; }
.labhead .eyebrow { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.labhead h2 { font-size: clamp(22px, 4vw, 32px); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--ch1); }

.bench-grid { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .bench-grid { grid-template-columns: minmax(0, 1fr); } .bench { grid-template-columns: 56px 1fr; } .bench .meter { grid-column: 2; } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.panel h4 { margin: 0; font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 5px 9px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.ctl { display: grid; gap: 2px; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.ctl label .mono { color: var(--ch1); font-size: 12px; }
.ctl input[type=range] { width: 100%; accent-color: var(--ch1); }
.readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.ro { background: var(--chip); border-radius: 4px; padding: 8px 10px; min-width: 0; }
.ro span { display: block; font-size: 11px; color: var(--muted); }
.ro b { font-family: var(--f-mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.note b { color: var(--ink); }
.scope { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px; min-width: 0; }
.scope canvas { display: block; width: 100%; height: 240px; }
.scope .cap { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding: 2px 4px 6px; }
.scope .cap i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
.plots { display: grid; gap: 12px; min-width: 0; }
.missions { display: grid; gap: 8px; }
.mission { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 14px; align-items: start; }
.mission .box { width: 18px; height: 18px; border: 2px solid var(--line); border-radius: 3px; margin-top: 2px; display: grid; place-items: center; font-size: 12px; color: #fff; }
.mission.done .box { background: var(--ok); border-color: var(--ok); }
.mission.done p { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--ok); }
.mission p { margin: 0; }

/* вопросы */
.qcard { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: grid; gap: 14px; max-width: 760px; }
.qmeta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.qtext { font-size: 17px; font-weight: 500; margin: 0; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: transparent; border-radius: 5px; padding: 10px 12px; cursor: pointer; font-size: 15px; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.opt.wrong { border-color: var(--pencil); background: color-mix(in srgb, var(--pencil) 10%, transparent); }
.opt:disabled { cursor: default; }
.numrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.numrow input { font-family: var(--f-mono); font-size: 16px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 5px; background: var(--paper); color: var(--ink); width: 160px; }
.verdict { border-left: 4px solid var(--ok); padding: 8px 12px; background: var(--chip); border-radius: 0 4px 4px 0; display: grid; gap: 6px; }
.verdict.bad { border-color: var(--pencil); }
.verdict h5 { margin: 0; font-size: 14px; font-family: var(--f-display); }
.verdict.bad h5 { color: var(--pencil); }
.verdict.good h5 { color: var(--ok); }
.verdict p { margin: 0; font-size: 14px; }
.say { font-size: 14px; border: 1px dashed var(--line); border-radius: 4px; padding: 8px 10px; }
.say b { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: block; }
.progress { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; max-width: 760px; }
.progress div { height: 100%; background: var(--ch1); transition: width .3s; }
.lives { color: var(--pencil); letter-spacing: 2px; }
.summary { display: grid; gap: 12px; max-width: 760px; }
.grade { font-family: var(--f-display); font-size: 40px; }

/* шпаргалка */
.cheat { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
.cheat .c { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; min-width: 0; }
.cheat .c h5 { margin: 0 0 6px; font-size: 14px; }
.cheat .c p { margin: 0; font-size: 14px; }
.cheat .f { font-family: var(--f-mono); font-size: 13px; color: var(--ch1); display: block; margin-top: 4px; overflow-x: auto; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 5px; font-size: 14px; z-index: 20; }
.schem .cap { justify-content: space-between; align-items: center; }
.schem canvas { height: auto; }
.scope .ov { position: absolute; pointer-events: none; }
.play { display: flex; gap: 4px; }
.play button { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-family: var(--f-mono); font-size: 12px; color: var(--ink); }
.play button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
.xpfloat { position: fixed; z-index: 31; transform: translate(-50%, 0); font-family: var(--f-display); font-size: 16px; color: var(--ok); pointer-events: none; animation: rise 1.1s ease-out forwards; }
@keyframes rise { to { transform: translate(-50%, -48px); opacity: 0; } }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.boss { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--card); border: 2px solid var(--pencil); border-radius: 6px; padding: 10px 14px; max-width: 760px; }
.boss .who { font-family: var(--f-display); font-size: 14px; color: var(--pencil); }
.boss .who small { display: block; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.bar { height: 10px; background: var(--chip); border-radius: 5px; overflow: hidden; }
.bar div { height: 100%; background: var(--pencil); transition: width .4s; }
.timer { font-family: var(--f-mono); font-size: 18px; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.timer.low { color: var(--pencil); }
.combo { font-family: var(--f-display); color: var(--amber); font-size: 13px; }
.led { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--line); margin-right: 6px; vertical-align: middle; }
.led.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.faultplot { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.faultplot canvas { display: block; width: 100%; height: 220px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="home" type="button"><h1>Стенд ЭУСУ</h1><span>ЛР2-ЛР8 · LT1001</span></button>
    <div class="stats">
      <span class="stat" id="rank">Первокурсник</span>
      <span class="stat">XP <b id="xp">0</b></span>
      <span class="stat">Зачтено <b id="passed">0</b>/7</span>
      <span class="stat">Ошибок к повтору <b id="due">0</b></span>
    </div>
    <button class="navbtn" id="review" type="button">Работа над ошибками</button>
    <button class="navbtn" id="snd" type="button" aria-pressed="true">Звук</button>
  </header>
  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden></div>
<canvas id="fx"></canvas>

<script>
'use strict';
// ---------- комплексные числа ----------
const C = (re, im = 0) => [re, im];
const cadd = (a, b) => [a[0] + b[0], a[1] + b[1]];
const csub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const cmul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
const cdiv = (a, b) => { const d = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / d, (a[1] * b[0] - a[0] * b[1]) / d]; };
const cabs = a => Math.hypot(a[0], a[1]);
const carg = a => Math.atan2(a[1], a[0]);
const cinv = a => cdiv([1, 0], a);
const par = (a, b) => cdiv(cmul(a, b), cadd(a, b));
const zC = (f, c) => cinv([0, 2 * Math.PI * f * c]);
const zR = r => [r, 0];

// модель LT1001: fT 0,85 МГц, второй полюс 1,75 МГц, A0 = 1e6 (откалибровано по LTspice)
const OA = { A0: 1e6, fT: 0.85e6, f2: 1.75e6, SR: 0.25e6, Usat: 14.05 };
function Aol(f, ideal) {
  if (ideal) return [1e12, 0];
  const fp = OA.fT / OA.A0;
  return cdiv([OA.A0, 0], cmul([1, f / fp], [1, f / OA.f2]));
}
// инвертирующая схема с конечным усилением ОУ
function invH(f, Zin, Zf, ideal) {
  const ratio = cdiv(Zf, Zin);
  const a = Aol(f, ideal);
  return cmul([-1, 0], cdiv(ratio, cadd([1, 0], cdiv(cadd([1, 0], ratio), a))));
}
// узловой расчёт схемы с ОУ: узлы in = 1 В, gnd = 0, ОУ как источник Vo = A (V+ - V-)
function nodal(f, net, ideal) {
  const idx = {}; net.nodes.forEach((n, i) => idx[n] = i);
  const N = net.nodes.length;
  const M = Array.from({ length: N }, () => Array.from({ length: N }, () => [0, 0]));
  const rhs = Array.from({ length: N }, () => [0, 0]);
  const known = n => n === 'in' ? [1, 0] : n === 'gnd' ? [0, 0] : null;
  for (const [t, a, b, v] of net.el) {
    const Y = t === 'R' ? [1 / v, 0] : [0, 2 * Math.PI * f * v];
    for (const [p, q] of [[a, b], [b, a]]) {
      if (!(p in idx) || p === net.op.o) continue;
      M[idx[p]][idx[p]] = cadd(M[idx[p]][idx[p]], Y);
      if (q in idx) M[idx[p]][idx[q]] = csub(M[idx[p]][idx[q]], Y);
      else rhs[idx[p]] = cadd(rhs[idx[p]], cmul(Y, known(q)));
    }
  }
  const A = Aol(f, ideal), o = idx[net.op.o];
  M[o][o] = cadd(M[o][o], [1, 0]);
  const put = (node, sign) => {
    const k = cmul(A, [sign, 0]);
    if (node in idx) M[o][idx[node]] = csub(M[o][idx[node]], k);
    else rhs[o] = cadd(rhs[o], cmul(k, known(node)));
  };
  put(net.op.p, 1); put(net.op.m, -1);
  // гаусс с выбором главного элемента
  for (let c = 0; c < N; c++) {
    let best = c;
    for (let r = c + 1; r < N; r++) if (cabs(M[r][c]) > cabs(M[best][c])) best = r;
    [M[c], M[best]] = [M[best], M[c]]; [rhs[c], rhs[best]] = [rhs[best], rhs[c]];
    for (let r = c + 1; r < N; r++) {
      const k = cdiv(M[r][c], M[c][c]);
      for (let j = c; j < N; j++) M[r][j] = csub(M[r][j], cmul(k, M[c][j]));
      rhs[r] = csub(rhs[r], cmul(k, rhs[c]));
    }
  }
  const x = Array(N);
  for (let r = N - 1; r >= 0; r--) {
    let s = rhs[r];
    for (let j = r + 1; j < N; j++) s = csub(s, cmul(M[r][j], x[j]));
    x[r] = cdiv(s, M[r][r]);
  }
  return x[o];
}

// ---------- форматирование ----------
const fmt = (v, d = 2) => {
  if (!isFinite(v)) return '∞';
  v = +v.toFixed(d); if (v === 0) v = 0;
  return v.toLocaleString('ru-RU', { maximumFractionDigits: d, minimumFractionDigits: 0 });
};
function si(v, unit, d = 3) {
  const a = Math.abs(v);
  if (a === 0) return '0 ' + unit;
  const pre = [[1e6, 'М'], [1e3, 'к'], [1, ''], [1e-3, 'м'], [1e-6, 'мк'], [1e-9, 'н'], [1e-12, 'п']];
  for (const [m, p] of pre) if (a >= m * 0.9995 || m === 1e-12) return fmt(v / m, d) + ' ' + p + unit;
  return fmt(v, d) + ' ' + unit;
}
const db = v => 20 * Math.log10(v);
// уточнение экстремума между соседними точками сетки (острые пики и провалы)
function refine(fs, ys, fn, sign) {
  let k = 0;
  ys.forEach((y, i) => { if (sign * y > sign * ys[k]) k = i; });
  let a = fs[Math.max(0, k - 1)], b = fs[Math.min(fs.length - 1, k + 1)], bx = fs[k], by = ys[k];
  for (let r = 0; r < 3; r++) {
    for (let i = 0; i <= 40; i++) {
      const f = a * Math.pow(b / a, i / 40), y = fn(f);
      if (sign * y > sign * by) { by = y; bx = f; }
    }
    const w = Math.pow(b / a, 1 / 40); a = bx / w; b = bx * w;
  }
  return [bx, by];
}
const logspace = (a, b, n) => Array.from({ length: n }, (_, i) => a * Math.pow(b / a, i / (n - 1)));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const softmin = (a, b, k) => -k * Math.log(Math.exp(-a / k) + Math.exp(-b / k));
const $ = (s, el = document) => el.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- рисование графиков ----------
function niceTicks(min, max, n = 6) {
  const span = max - min, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));

// ---------- ЛР8: источники тока ----------
const LR8C = {
  m: { name: 'Зеркало с Rэ', Iset: (E, R1) => 0.985 * (E - 0.72) / (R1 + 10), Rout: 22e3, Vs: 0.2, Re: 10, R1: true },
  w: { name: 'Зеркало Уилсона', Iset: (E, R1) => 0.995 * (E - 1.6) / (R1 + 5), Rout: 35e3, Vs: 1.0, Re: 5, R1: true },
  o: { name: 'На ОУ', Iset: () => 0.3 * 57 / 58, Rout: 1e8, Vs: 0.45, Re: 10, R1: false },
};
function lr8(c, E, Rn, R1) {
  const m = LR8C[c], I0 = m.Iset(E, R1) / (1 + Rn / m.Rout), Isat = Math.max(0, (E - m.Vs) / (Rn + m.Re));
  return softmin(I0, Isat, 0.004 * I0);
}
const LR8 = {
  init: { c: 'm', E: 12, Rn: 50, R1m: 100, R1w: 68 },
  controls: s => [
    { type: 'seg', key: 'c', label: 'Источник', opts: Object.entries(LR8C).map(([k, v]) => [k, v.name]) },
    { type: 'range', key: 'E', label: 'Напряжение питания Eп', min: 6, max: 16, step: 0.1, show: v => fmt(v, 1) + ' В' },
    { type: 'range', key: 'Rn', label: 'Сопротивление нагрузки', min: 1, max: 300, log: true, show: v => si(v, 'Ом') },
    ...(LR8C[s.c].R1 ? [{ type: 'range', key: 'R1' + s.c, label: 'Токозадающий R1', min: 40, max: 200, step: 1, show: v => fmt(v, 0) + ' Ом' }] : []),
  ],
  view(s) {
    const R1 = s['R1' + s.c] || 0;
    const I = lr8(s.c, s.E, s.Rn, R1), U = I * s.Rn;
    const I2 = lr8(s.c, s.E, s.Rn * 1.05, R1);
    const work = Math.abs(I2 - I) / I < 0.01;
    const rs = logspace(1, 300, 120), ir = rs.map(R => lr8(s.c, s.E, R, R1) * 1e3);
    const es = [], ie = [];
    for (let i = 0; i <= 50; i++) { const e = 6 + 10 * i / 50; es.push(e); ie.push(lr8(s.c, e, s.Rn, R1) * 1e3); }
    const notes = {
      m: 'Опорный ток задаёт R1 от самого питания: I ≈ (Eп − 0,7)/(R1 + Rэ). Зеркало копирует его в нагрузку, но и зависимость от питания тоже копирует. Rэ - местная обратная связь против разброса и нагрева.',
      w: 'T1 отбирает из узла базы T3 ток, равный выходному, и подстраивает T3. Ошибка от токов баз почти исчезает, Rвых больше. В опорной ветви два перехода по 0,8 В, поэтому 141,7 мА вместо 150.',

    };
    return {
      anim: { dc: true, frames: [{ I, q: 1, oa: 0.3, U1: I * 58 / 57 * 10 }] },
      v: { I, U, work },
      readouts: [['Ток нагрузки', fmt(I * 1e3, 1) + ' мА'], ['Напряжение на нагрузке', fmt(U, 2) + ' В'], ['Режим', work ? 'рабочая область' : 'насыщение, ток падает']],
      plots: [
        { legend: [['--ch2', 'Iн(Rн), мА']], cfg: { x: { min: 1, max: 300, log: true, fmt: v => fmt(v, 0) }, y: { min: 0, max: Math.max(...ir) * 1.15, fmt: v => fmt(v, 0) }, series: [{ x: rs, y: ir, color: css('--ch2'), w: 3 }], points: [{ x: s.Rn, y: I * 1e3, color: css('--ch1') }], xlabel: 'Rн, Ом' } },
        { legend: [['--ch1', 'Iн(Eп), мА']], cfg: { x: { min: 6, max: 16, fmt: v => fmt(v, 0) }, y: { min: 0, max: Math.max(...ie) * 1.15, fmt: v => fmt(v, 0) }, series: [{ x: es, y: ie, color: css('--ch1'), w: 3 }], points: [{ x: s.E, y: I * 1e3, color: css('--ch2') }], xlabel: 'Eп, В' } },
      ],
      note: notes[s.c],

  },
  missions: [

  { id: 'b2', t: 'n', q: 'При A = 1700 какой минимальный вход нужен, чтобы выход дошёл до 14 В, мВ?', ans: 8.2, rel: 0.08, unit: 'мВ', exp: '14 / 1700 ≈ 8 мВ. Поэтому при 1 В выход практически прямоугольный.' },
  { id: 'b3', t: 'c', q: 'На нуль-компаратор подали синус 1 В на 10 кГц. Что на выходе?', o: [
    ['Чёткий прямоугольник ±14 В', 0, 'По усилению хватает (A = 80), но выход не успевает: 28 В / 0,25 В/мкс = 112 мкс, а полупериод всего 50 мкс.'],
    ['Треугольник размахом около 12,5 В, не доходит до ±14 В', 1, 'За 50 мкс выход пробегает 0,25 × 50 = 12,5 В и разворачивается. Это ограничение скорости нарастания.'],
    ['Усиленный синус 80 мВ', 0, '1 В × 80 = 80 В, усиления хватает с запасом.'],
    ['Ноль', 0, 'Сигнал проходит, просто выход не успевает добежать до насыщения.']], exp: 'Время переключения = размах / SR. Компаратору нужно и Uвх > 14·f/fT, и полупериод заметно больше 112 мкс.' },
  { id: 'b4', t: 'n', q: 'Одновходовый компаратор: Uоп = −8 В, R1 = 100 Ом, R2 = 200 Ом. Порог, В?', ans: 4, abs: 0.05, unit: 'В', exp: 'Uпор = −Uоп·R1/R2 = 8·100/200 = 4 В. Компенсирующий резистор тогда R1∥R2 ≈ 67 Ом.' },
  { id: 'b5', t: 'c', q: 'Двухвходовый компаратор: сигнал на минусе, −3 В на плюсе. Как сделать, чтобы выход был +14 В при входе выше −3 В?', o: [
    ['Поменять входы: сигнал на плюс, опорное на минус', 1, 'Выход в +Uнас, когда на плюсе больше. Сигнал на плюсе - прямой выход.'],
    ['Поменять знак опорного на +3 В', 0, 'Тогда сменится порог, а направление останется инверсным.'],
    ['Добавить резистор обратной связи', 0, 'Это даст гистерезис или усилитель, но не поменяет направление.'],
    ['Подать питание наоборот', 0, 'ОУ так не работает.']], exp: 'Правило: вход на плюс - срабатывает при превышении порога, на минус - при снижении.' },
  { id: 'b6', t: 'n', q: 'Компаратор с гистерезисом: R1 = 1,67 кОм, R2 = 10 кОм, Uоп = −3 В, Uнас = 14 В. Верхний порог, В?', ans: -0.57, abs: 0.04, unit: 'В', exp: 'Наложение: U+ = Uоп·R2/(R1+R2) + Uнас·R1/(R1+R2) = −2,571 + 2,003 = −0,57 В. Нижний −4,57 В, петля 4 В. У каждого источника множитель - дальний резистор.' },
  { id: 'b7', t: 'c', q: 'На компаратор с порогами −0,57 и −4,57 В подали синус 1 В вокруг нуля. Что на выходе?', o: [
    ['Прямоугольник с двумя переключениями за период', 0, 'Чтобы переключиться обратно, вход должен опуститься до −4,57 В. Синус 1 В туда не достаёт.'],
    ['Постоянно −14 В, переключений нет', 1, 'Уже при t = 0 вход выше −0,57, выход в −14 В. Обратно нужен вход ниже −4,57.'],
    ['Синус, усиленный в 14 раз', 0, 'С положительной ОС линейного режима нет.'],
    ['Дребезг', 0, 'Гистерезис как раз убирает дребезг.']], exp: 'Минимальная амплитуда для переключения больше 4,57 В: синус должен зайти ниже нижнего порога. С запасом берут 5 В.' },
  { id: 'b8', t: 'c', q: 'Где положительная обратная связь в триггере Шмитта, если на плюс приходит только сигнал?', o: [
    ['Через транзистор: высокий выход открывает VT1, тот снижает порог на минусе, разность U+ − U− растёт', 1, 'Опустить минус - то же, что поднять плюс. Изменение выхода усиливает само себя.'],
    ['Её там нет, гистерезис от стабилитрона', 0, 'Стабилитрон только ограничивает выход до 4,7 В для ТТЛ.'],
    ['Через R4', 0, 'R4 питает стабилитрон и нагрузку.'],
    ['Через D1', 0, 'D1 защищает переход база-эмиттер.']], exp: 'Обратная связь положительная, если изменение выхода увеличивает разность входов в ту же сторону. Неважно, на какой вход она приходит.' },
  { id: 'b9', t: 'c', q: 'В триггере Шмитта транзистор сгорел в обрыв. Что станет со схемой?', o: [
    ['Один порог 7 В, гистерезиса нет, при шуме будет дребезг', 1, 'Транзистор больше не закорачивает R3, делитель всегда полный.'],
    ['Один порог 3,9 В', 0, 'Это при коротком замыкании транзистора: R3 закорочен всегда.'],
    ['Выход всегда 0', 0, 'Компаратор работает, просто с одним порогом.'],
    ['Схема начнёт генерировать', 0, 'Генератору нужен интегратор в петле, как в ЛР7.']], exp: 'Гистерезис существует, только пока транзистор переключается.' },
  { id: 'b10', t: 'c', q: 'Зачем диод D1 между базой и эмиттером VT1?', o: [
    ['При −14 В на выходе ОУ держит базу на −0,7 В: переход Б-Э выдерживает обратно только около 6 В', 1, 'Без D1 переход пробился бы: кремний начинает проводить лавиной, в нём появляются дефекты, и h21 необратимо падает. Остальные 13,3 В берёт на себя R_B.'],
    ['Ограничивает выход до 4,7 В', 0, 'Это делает стабилитрон на выходе.'],
    ['Ускоряет открывание транзистора', 0, 'D1 при положительном выходе закрыт и не участвует.'],
    ['Компенсирует ток смещения', 0, 'Ток смещения тут ни при чём.']], exp: 'Ток через R_B течёт всегда около 20 мкА: при плюсе в базу, при минусе через D1.' },
  { id: 'b11', t: 'c', q: 'Оконный компаратор: зачем R4 = 2 кОм от выхода на землю?', o: [
    ['Внутри окна оба диода закрыты, и R4 подтягивает выход к нулю', 1, 'Без R4 выход висит в воздухе и держит прежние 13 В на паразитной ёмкости.'],
    ['Ограничивает ток диодов', 0, 'Ток при высоком уровне 6,6 мА, ОУ его выдерживает, но цель R4 не в этом.'],
    ['Задаёт ширину окна', 0, 'Окно задаёт R2 в делителе.'],
    ['Компенсирует токи смещения', 0, 'Нет.']], exp: 'Слишком маленький R4 ОУ не потянет (100 Ом = 133 мА), слишком большой медленно разряжает ёмкость.' },
  { id: 'b12', t: 'n', q: 'Оконный компаратор: Vop просел до 10 В, R1 = 1,5 кОм, R2 = 200 Ом, R3 = 700 Ом. Верхний порог, В?', ans: 3.75, abs: 0.03, unit: 'В', exp: 'Ток 10/2,4 = 4,17 мА. Верхняя точка H - это всё, что ниже неё: 4,17 × (0,2 + 0,7) = 3,75 В. 6,25 В - это падение на R1, частая ошибка.' },
],
lr4: [
  { id: 'c1', t: 'n', q: 'Ограничитель с K = 5 и уровнем 10,43 В. При каком |Uвх| начинается ограничение, В?', ans: 2.09, rel: 0.04, unit: 'В', exp: 'Выход растёт как 5·Uвх до уровня ограничения: 10,43 / 5 ≈ 2,1 В.' },
  { id: 'c2', t: 'c', q: 'Почему уровень ограничения не зависит от K?', o: [
    ['Минус ОУ - виртуальная земля, на элементе в ОС лежит всё Uвых, уровень задаёт сам элемент', 1, 'Элемент открывается при своём напряжении, и это напряжение и есть выход.'],
    ['Зависит, просто слабо', 0, 'От K зависит только точка излома по входу.'],
    ['Потому что ОУ в насыщении', 0, 'При ограничении ОУ в линейном режиме, его держит открытый элемент.'],
    ['Из-за R1', 0, 'R1 задаёт ток через элемент, но не уровень.']], exp: 'K задаёт, при каком входе начнётся ограничение.' },
  { id: 'c3', t: 'c', q: 'Один диод анодом к выходу, катодом к минусу ОУ. Какая полуволна выхода ограничена?', o: [
    ['Положительная, на ~0,6 В; отрицательная идёт до −14 В', 1, 'Диод открыт, когда выход выше минуса (виртуальной земли).'],
    ['Отрицательная на −0,6 В', 0, 'Это для обратного включения диода.'],
    ['Обе на ±0,6 В', 0, 'Для обеих нужны два встречных диода или стабилитроны.'],
    ['Никакая', 0, 'Ограничивает, в LTspice +0,61 В.']], exp: 'Направление диода определяет полуволну, число диодов - уровень.' },
  { id: 'c4', t: 'n', q: 'Два диода последовательно в обратной связи. Модуль уровня ограничения, В?', ans: 1.2, abs: 0.06, unit: 'В', exp: '2 × 0,6 = 1,2 В, в LTspice 1,21 В.' },
  { id: 'c5', t: 'c', q: 'Встречные стабилитроны 10 В: почему 10,43 В, а не 10,6?', o: [
    ['Ток стабилитрона всего 1,65 мА, а 10 В указаны при 5 мА', 1, 'Ток через элемент ≈ Uвх/R1 = 16,5/10 кОм. При меньшем токе напряжение пробоя чуть ниже.'],
    ['Мешает насыщение ОУ', 0, 'До 14 В далеко.'],
    ['Ошибка расчёта коэффициента', 0, 'K на уровень не влияет.'],
    ['Диоды открываются при 0,8 В', 0, 'Наоборот, при малом токе прямое падение меньше 0,6.']], exp: 'Реальные диоды и стабилитроны имеют экспоненциальную ВАХ, поэтому и излом плавный.' },
  { id: 'c6', t: 'c', q: 'Схема Гусева без резистора Rос. Что получится?', o: [
    ['Компаратор с уровнями ±11,4 В', 1, 'В линейном режиме нет отрицательной ОС, ОУ усиливает в полную силу, а мост держит уровни.'],
    ['Ограничитель с K = 5', 0, 'K = 5 задаёт как раз Rос.'],
    ['Выход всё время ноль', 0, 'Нет, выход скачет между ±11,4 В.'],
    ['Генератор', 0, 'Нет положительной ОС.']], exp: 'Переключение происходит, когда вход проходит через ноль.' },
  { id: 'c7', t: 'n', q: 'Схема Гусева: Uz = 10 В, прямое падение диода 0,6 В. Уровень ограничения, В?', ans: 11.2, abs: 0.05, unit: 'В', exp: 'Ток идёт через два диода моста и стабилитрон: 10 + 2·0,6 = 11,2 В (LTspice 11,37). Одним стабилитроном в обе стороны.' },
  { id: 'c8', t: 'c', q: 'Почему у схемы Гусева излом резче, чем у встречных стабилитронов?', o: [
    ['Стабилитрон в мосту уже в пробое от питания, его ток в момент ограничения почти не меняется', 1, 'Открываются только диоды моста, а стабилитрон держит уже стабильное напряжение.'],
    ['Там больше K', 0, 'K одинаковый, 5.'],
    ['Стабилитрон мощнее', 0, 'Тот же BZX84C10L.'],
    ['Из-за R2, R3 на 10 кОм', 0, 'Они как раз держат стабилитрон в пробое, но излом резкий по другой причине.']], exp: 'R2 = R3 = (2E − Uz)/(2Iz) = 10 кОм при токе 1 мА.' },
],
lr5: [
  { id: 'd1', t: 'n', q: 'ФНЧ: R2 = 3180 Ом параллельно C1 = 10 нФ. Частота среза, кГц?', ans: 5, rel: 0.03, unit: 'кГц', exp: 'fср = 1/(2πR2C1) = 5,0 кГц, там Xc = R2. В LTspice 4,86 кГц.' },
  { id: 'd2', t: 'c', q: 'ФНЧ на частоте среза: |K| и фаза?', o: [
    ['K0/√2 ≈ 3,54 и 135°', 1, 'Модуль падает в √2 раз (−3 дБ), фаза: 180° от инверсии минус 45° от RC.'],
    ['K0/2 и 90°', 0, 'Пополам делится только при двух резисторах. С R и C сопротивление делится на √2.'],
    ['K0 и 180°', 0, 'Это на низких частотах.'],
    ['0 и 0°', 0, 'Нет.']], exp: '−3 дБ = 0,707 от максимума, это определение границы полосы.' },
  { id: 'd3', t: 'c', q: 'Почему ФВЧ 1-го порядка с LT1001 оказался полосовым (5,6-175 кГц)?', o: [
    ['Неинвертирующий усилитель с K = 6 имеет полосу около fT/6 ≈ 133 кГц', 1, 'Сверху его режет сам ОУ.'],
    ['Конденсатор C1 стоит не там', 0, 'Схема собрана верно.'],
    ['Так задумано методикой', 0, 'По методике это ФВЧ, полосу добавил ОУ.'],
    ['Из-за R1 = 2650 Ом', 0, 'R1 задаёт нижнюю частоту.']], exp: 'Нижняя граница 5,6 кГц ниже расчётных 6 кГц, потому что −3 дБ отсчитано от меньшего максимума 5,79.' },
  { id: 'd4', t: 'c', q: 'Наклон АЧХ ФВЧ 2-го порядка ниже частоты среза?', o: [
    ['+40 дБ/дек: рост в 100 раз за декаду', 1, 'Два конденсатора, второй порядок. В LTspice за декаду рост в 91 раз.'],
    ['+20 дБ/дек', 0, 'Это первый порядок.'],
    ['−40 дБ/дек', 0, 'Ниже среза ФВЧ коэффициент растёт с частотой, а не падает.'],
    ['0', 0, 'Нет.']], exp: 'Каждый порядок добавляет 20 дБ/дек.' },
  { id: 'd5', t: 'n', q: 'Полосовой MFB: K0 = R3·C2/(R1·(C1+C2)), R3 = 1770 Ом, R1 = 110,5 Ом, C1 = C2. Чему равен K0?', ans: 8, rel: 0.02, unit: '', exp: '1770 / (2·110,5) = 8,0. В LTspice 8,3 на 36 кГц.' },
  { id: 'd6', t: 'c', q: 'Почему центр полосового фильтра в LTspice 36 кГц, а не расчётные 40?', o: [
    ['На 40 кГц у LT1001 A ≈ 20, всего в 2,5 раза больше K фильтра; запаздывание ОУ сдвигает резонанс', 1, 'Сдвиг на 10 % - влияние полосы ОУ.'],
    ['Номиналы округлены', 0, 'Округление даёт доли процента.'],
    ['Ошибка формулы', 0, 'Формула для идеального ОУ даёт 39,99 кГц.'],
    ['Слишком большой вход', 0, 'Для .ac амплитуда не важна.']], exp: 'Включи на стенде идеальный ОУ, и центр вернётся на 40 кГц.' },
  { id: 'd7', t: 'c', q: 'Режекторный фильтр: почему провал −48 дБ, а не полный ноль?', o: [
    ['R3 подключён к выходу ОУ, а LT1001 на 40 кГц немного сдвигает фазу и нарушает баланс моста', 1, 'Сигналы двух Т-звеньев компенсируются не до нуля.'],
    ['Не выполнено R3 = R/2', 0, 'Выполнено: 198,9 = 397,9/2.'],
    ['Мало точек расчёта', 0, 'Нет, это физика схемы.'],
    ['Конденсаторы с потерями', 0, 'В модели конденсаторы идеальные.']], exp: 'f0 = 1/(2πRC) = 40 кГц, провал в LTspice на 39,85 кГц.' },
  { id: 'd8', t: 'c', q: 'Q = 0,577 у ФВЧ 2-го порядка означает…', o: [
    ['Фильтр Бесселя: АЧХ без подъёма, плавно подходит к полосе', 1, 'У Баттерворта 0,707, при большем Q появляется подъём.'],
    ['Фильтр Чебышева с пульсациями', 0, 'У Чебышева Q больше 0,707.'],
    ['Фильтр неустойчив', 0, 'Нет.'],
    ['Полоса 0,577 кГц', 0, 'Q безразмерный.']], exp: 'Бессель даёт линейную ФЧХ и минимальные искажения формы импульсов.' },
],
lr6: [
  { id: 'e1', t: 'n', q: 'Параметрический: Uвх = 12 В, Uст = 6 В, R1 = 400 Ом. Ток через R1, мА?', ans: 15, rel: 0.02, unit: 'мА', exp: '(12 − 6)/400 = 15 мА. Пока стабилитрон держит 6 В, этот ток постоянен.' },
  { id: 'e2', t: 'n', q: 'Та же схема, Rн = 2000 Ом. Ток стабилитрона, мА?', ans: 12, rel: 0.03, unit: 'мА', exp: 'Нагрузка берёт 6/2000 = 3 мА, остаток 15 − 3 = 12 мА забирает стабилитрон.' },
  { id: 'e3', t: 'c', q: 'Параметрический стабилизатор при Uвх = 8 В. Что на выходе (Rн = 600 Ом)?', o: [
    ['4,8 В: стабилитрон не пробит, работает делитель R1-Rн', 1, '8·600/1000 = 4,8 В. Стабилизация начинается примерно с 10 В.'],
    ['6 В', 0, 'Для пробоя нужно 6 В на стабилитроне, а делитель даёт меньше.'],
    ['8 В', 0, 'На R1 падает часть напряжения.'],
    ['0', 0, 'Ток через R1 и нагрузку идёт.']], exp: 'Отсюда требование Uвх.min > Uвых + 2,5…3 В.' },
  { id: 'e4', t: 'c', q: 'Зачем во второй схеме транзистор?', o: [
    ['Усилитель тока: стабилитрон даёт только ток базы, в β ≈ 50 раз меньше тока нагрузки', 1, 'Стабилитрон становится источником опорного напряжения, ток нагрузки идёт от входа через транзистор.'],
    ['Чтобы повысить выходное напряжение', 0, 'Выход наоборот ниже на Uбэ.'],
    ['Для защиты от КЗ', 0, 'Защиты в этой схеме нет.'],
    ['Чтобы уменьшить пульсации', 0, 'Не основная роль.']], exp: 'Отсюда 0,5 А вместо 15 мА, но транзистор греется: (12 − 6)·0,5 = 3 Вт.' },
  { id: 'e5', t: 'c', q: 'Почему в схеме с повторителем стабилитрон на 6,5 В, а не на 6?', o: [
    ['Uвых = Uст − Uбэ, а у 2N3055 при 0,5 А Uбэ ≈ 0,45 В', 1, 'Эмиттер повторяет базу за вычетом перехода база-эмиттер.'],
    ['Чтобы был запас по току', 0, 'Запас по току даёт R1, а не напряжение стабилитрона.'],
    ['Других не было', 0, 'Нет, выбор расчётный.'],
    ['Из-за R1', 0, 'R1 задаёт ток, а не напряжение.']], exp: 'По методике Vd = 0,6 + Vout.' },
  { id: 'e6', t: 'c', q: 'Компенсационный стабилизатор: выход вырос. Что делает схема?', o: [
    ['База Q1 растёт, Q1 открывается и снижает базу Q2, Q2 и Q3 прикрываются, выход возвращается', 1, 'Это отрицательная обратная связь: схема реагирует на ошибку выхода.'],
    ['Стабилитрон D1 забирает лишний ток', 0, 'D1 только задаёт опору 3 В для Q1.'],

    { q: 'Параметрический стабилизатор: выход просел до 4,6 В при входе 12 В. Что не так?', show: { c: 'p', Rp: 250 }, plot: 1, o: [
      ['Нагрузка 250 Ом хочет 24 мА, а R1 даёт всего 15 мА: стабилитрону ничего не осталось', 1, 'Предел этой схемы - 400 Ом.'], ['Пробит стабилитрон', 0, 'Пробитый в КЗ стабилитрон дал бы около нуля.'], ['Мало входное', 0, 'Вход 12 В нормальный.'], ['Сгорел R1', 0, 'Без R1 выход был бы 0.']] },
    { q: 'Параметрический стабилизатор: выход 5,1 В и плавно ползёт за входом. Что не так?', show: { c: 'p', Uin: 8.5 }, plot: 0, o: [
      ['Мало входное: стабилитрон не пробит, работает делитель R1-Rн', 1, 'Нужно Uвх.min > Uвых + 2,5…3 В.'], ['Слишком маленькая нагрузка', 0, 'Нагрузка 600 Ом номинальная.'], ['Не тот стабилитрон', 0, 'Стабилитрон 6 В правильный.'], ['Обрыв R1', 0, 'Тогда выход был бы 0.']] },
  ],
  lr7: [
    { q: 'Повышающий: на выходе 10,3 В вместо 12, пульсации в норме. Что не так?', show: { c: 'boost', Uin: 6 }, plot: 1, o: [
      ['Вход просел до 6 В, а без обратной связи D не подстраивается', 1, 'Uвых = Uвх/(1 − D). Нужно D ≈ 0,51.'], ['Мала ёмкость', 0, 'Ёмкость влияет на пульсации, а не на среднее.'], ['Мала индуктивность', 0, 'L влияет на пульсации тока.'], ['Пробит диод', 0, 'Тогда выход замкнулся бы на точку X.']] },
    { q: 'Повышающий: среднее 12 В, но пульсации выхода выросли вчетверо. Что не так?', show: { c: 'boost', C: 12e-6 }, plot: 2, o: [
      ['Высохла ёмкость: ΔU = Iн·D/(f·C)', 1, 'C в 4 раза меньше - пульсации в 4 раза больше.'], ['Мала индуктивность', 0, 'Тогда выросли бы пульсации тока катушки.'], ['Не та частота ШИМ', 0, 'Частота изменила бы обе пульсации.'], ['Большая нагрузка', 0, 'Нагрузка номинальная.']] },
  ],
  lr8: [
    { q: 'Источник на ОУ: ток упал с 295 до 145 мА. Что не так?', show: { c: 'o', Rn: 70 }, plot: 0, o: [
      ['Нагрузка 70 Ом слишком велика: транзистор в насыщении, на нагрузке не больше ~9 В', 1, 'Рабочая область этой схемы - до 30 Ом.'], ['Упала опора', 0, 'Опора 3 В отдельная.'], ['Сгорел R1', 0, 'Без R1 ток был бы 0.'], ['ОУ без ОС', 0, 'ОС на месте.']] },
    { q: 'Зеркало с Rэ: ток вырос до 127 мА при той же нагрузке. Что не так?', show: { c: 'm', E: 15 }, plot: 1, o: [
      ['Поднялось питание: опорный ток задан R1 прямо от питания', 1, '+9 мА на каждый вольт.'], ['Пробит T2', 0, 'Тогда ток ограничивала бы только нагрузка.'], ['Уменьшился Rэ', 0, 'Возможно, но график показывает рост вместе с Eп.'], ['Перегрев', 0, 'Rэ как раз держит ток при нагреве.']] },
  ],
};

// ---------- прогресс ----------
const KEY = 'eusu-stand-v1';
let progress = (() => {
  try { const p = JSON.parse(localStorage.getItem(KEY)); if (p && p.labs) return p; } catch (e) {}
  return null;
})() || { xp: 0, labs: {}, deck: {} };
LABS.forEach(l => { progress.labs[l.id] = progress.labs[l.id] || { best: 0, missions: {}, right: {} }; });
function save() { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {} }
function addXP(n) { progress.xp += n; refreshStats(); }
const today = () => Math.floor(Date.now() / 864e5);
function deckPush(id) { progress.deck[id] = { box: 0, due: today() }; }
function deckRight(id) { const d = progress.deck[id]; if (!d) return; d.box++; if (d.box >= 3) delete progress.deck[id]; else d.due = today() + [1, 3, 7][d.box]; }
const dueList = () => Object.entries(progress.deck).filter(([, d]) => d.due <= today()).map(([id]) => id);
function stars(id) {
  const p = progress.labs[id], lab = LABS.find(l => l.id === id);
  const m = lab.sim.missions.every(x => p.missions[x.id]);
  return [m, p.best >= 0.8, p.best >= 1].filter(Boolean).length;
}
function refreshStats() {
  $('#xp').textContent = progress.xp;
  const rk = rank(progress.xp);
  if ($('#rank').textContent !== rk) { if (progress.xp > 0 && current.screen) toast('Новое звание: ' + rk); $('#rank').textContent = rk; }
  $('#passed').textContent = LABS.filter(l => progress.labs[l.id].best >= 0.8).length;
  $('#due').textContent = Object.keys(progress.deck).length;
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 2200); }

// ---------- экраны ----------
const view = $('#view');
function showMap() {
  current = { screen: 'map' };
  refreshStats();
  const lit = LABS.filter(l => progress.labs[l.id].best >= 0.8).length;
  view.innerHTML = `<section class="hero"><h2>${lit === 7 ? 'Все стенды под напряжением' : 'Лаборатория обесточена'}</h2>
    <p>${lit === 7 ? 'Все семь стендов зачтены. Осталось сдать экзамен.' : `Под напряжением ${lit} из 7 стендов. Чтобы включить стенд, разберись со схемой, почини неисправности и сдай подковырки на 80 %.`} На стенде схема живая: ток бежит по проводам, графики пересчитываются от каждого ползунка. Ошибки возвращаются через 1, 3 и 7 дней.</p></section>
    <div class="benches">${LABS.map(l => {
      const s = stars(l.id), pass = progress.labs[l.id].best >= 0.8;
      return `<button class="bench" type="button" data-lab="${l.id}"><span class="no">${l.no}<small><span class="led ${pass ? 'on' : ''}"></span>${pass ? 'включён' : 'стенд'}</small></span>
        <span><h3>${l.title} ${pass ? '<span class="stamp">зачтено</span>' : ''}</h3><p>${l.sub}</p></span>
        <span class="meter" aria-label="${s} из 3">${[0, 1, 2].map(i => `<i class="${i < s ? 'on' : ''}"></i>`).join('')}</span></button>`;
    }).join('')}</div>
    <div class="exam-card"><div><h3>Экзамен</h3><p>Бой с экзаменатором: 12 вопросов по всем лабам, 45 секунд на ответ, три жизни. Серия верных ответов бьёт сильнее. Сначала идут вопросы, на которых ты уже ошибался.</p></div>
    <button class="btn red" type="button" id="exam">Начать</button></div>
    <p class="note" style="margin-top:16px">Кружки: все задания стенда, 80 % подковырок, 100 % подковырок. Зачёт по лабе - от 80 %. Звание растёт с XP. Прогресс хранится в этом браузере.</p>`;
  view.querySelectorAll('[data-lab]').forEach(b => b.onclick = () => openLab(b.dataset.lab, 'bench'));
  $('#exam').onclick = () => startQuiz(examSet(), 'Экзамен', null, 3);
}
let current = { screen: 'map' };
function openLab(id, tab) {
  clearInterval(quizTimer);
  const lab = LABS.find(l => l.id === id);
  current = { screen: 'lab', id, tab };
  view.innerHTML = `<section class="labhead"><span class="eyebrow">${lab.no} · ${lab.sub}</span><h2>${lab.title}</h2></section>
    <div class="tabs" role="tablist">${[['bench', 'Стенд'], ['repair', 'Ремонт'], ['quiz', 'Подковырки'], ['cheat', 'Шпаргалка']].map(([k, t]) =>
      `<button class="tab" role="tab" type="button" data-tab="${k}" aria-selected="${k === tab}">${t}</button>`).join('')}</div><div id="tabbody"></div>`;
  view.querySelectorAll('.tab').forEach(b => b.onclick = () => openLab(id, b.dataset.tab));
  const body = $('#tabbody');
  lastRender = null;
  if (tab === 'bench') buildBench(body, lab);
  else if (tab === 'repair') startQuiz(FAULTS[id].map((f, k) => ({ ...f, id: id + '-fix' + k, t: 'c', lab: id, exp: 'Найди это на стенде: выставь те же параметры и посмотри на схему.', repair: true })), lab.no + ' · ремонт', id, 0, body);
  else if (tab === 'cheat') body.innerHTML = `<div class="cheat">${CHEAT[id].map(([h, p, f]) => `<div class="c"><h5>${h}</h5><p>${p}</p>${f ? `<span class="f">${f}</span>` : ''}</div>`).join('')}</div>`;
  else startQuiz(Q[id].map(q => ({ ...q, lab: id })), lab.no + ' · подковырки', id, 0, body);
  window.scrollTo({ top: 0 });
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function examSet() {
  const due = shuffle(ALLQ.filter(q => progress.deck[q.id]));
  const rest = shuffle(ALLQ.filter(q => !progress.deck[q.id]));
  // равномерно по лабам
  const byLab = {}; rest.forEach(q => (byLab[q.lab] = byLab[q.lab] || []).push(q));
  const spread = []; let k = 0;
  while (spread.length < rest.length) { for (const l of LABS) { const a = byLab[l.id] || []; if (a[k]) spread.push(a[k]); } k++; }
  return [...due, ...spread].slice(0, 12);
}

let quizTimer = null;
function startQuiz(qs, title, labId, lives, root = view) {
  let i = 0, right = 0, life = lives, wrongs = [], combo = 0, best = 0, patience = 100;
  const order = qs, boss = lives > 0, repair = qs.length && qs[0].repair;
  const step = () => {
    clearInterval(quizTimer);
    if (i >= order.length || (lives && life <= 0) || (boss && patience <= 0)) return finish();
    const q = order[i], lab = LABS.find(l => l.id === q.lab);
    root.innerHTML = `${boss ? `<div class="boss"><span class="who">Экзаменатор<small>терпение</small></span><div class="bar"><div id="pat" style="width:${patience}%"></div></div><span class="timer" id="tm">45</span></div>` : ''}
      <div class="progress" style="margin-top:${boss ? 10 : 0}px"><div style="width:${i / order.length * 100}%"></div></div>
      <div class="qcard" style="margin-top:12px">
      <div class="qmeta"><span>${title}</span><span>· ${i + 1}/${order.length}</span>${!labId ? `<span>· ${lab.no}</span>` : ''}${lives ? `<span class="lives">${'♥'.repeat(life)}${'♡'.repeat(lives - life)}</span>` : ''}${combo >= 2 ? `<span class="combo">серия ×${combo}</span>` : ''}</div>
      <p class="qtext">${q.q}</p>${q.show ? '<div class="faultplot"><canvas id="fp"></canvas></div>' : ''}<div id="ans"></div><div id="res"></div></div>`;
    if (q.show) {
      const sim = lab.sim, out = sim.view({ ...sim.init, ...q.show }), p = out.plots[q.plot];
      plot($('#fp', root), p.cfg);
      lastRender = () => { const c = $('#fp', root); if (c) plot(c, p.cfg); };
    }
    const ans = $('#ans', root), res = $('#res', root);
    let answered = false;
    if (boss) {
      let left = 45;
      quizTimer = setInterval(() => {
        const el = $('#tm', root); if (!el || answered) { clearInterval(quizTimer); return; }
        left--; el.textContent = left; el.classList.toggle('low', left <= 10);
        if (left <= 5 && left > 0) SND.tick();
        if (left <= 0) { clearInterval(quizTimer); ans.querySelectorAll('button, input').forEach(x => x.disabled = true); done(false, 'Время вышло.'); }
      }, 1000);
    }
    const done = (ok, why) => {
      if (answered) return; answered = true; clearInterval(quizTimer);
      const card = $('.qcard', root);
      if (ok) {
        right++; combo++; best = Math.max(best, combo);
        const gain = (repair ? 15 : 10) * (boss ? Math.min(3, combo) : 1);
        addXP(gain); SND.ok(); floatXP(res, '+' + gain + ' XP');
        const r = card.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + 40, combo >= 3 ? 40 : 22);
        if (repair) (progress.labs[q.lab].fixed = progress.labs[q.lab].fixed || {})[q.id] = true;
        else { deckRight(q.id); progress.labs[q.lab].right[q.id] = true; }
        if (boss) { patience = Math.max(0, patience - 100 / 9 * (combo >= 3 ? 1.5 : 1)); const pb = $('#pat', root); if (pb) pb.style.width = patience + '%'; }
      } else {
        combo = 0; SND.bad(); if (!reduced) { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
        if (!repair) deckPush(q.id); wrongs.push(q); if (lives) life--;
      }
      save(); refreshStats();
      const last = !(i + 1 < order.length && !(lives && life <= 0) && !(boss && patience <= 0));
      res.innerHTML = `<div class="verdict ${ok ? 'good' : 'bad'}"><h5>${ok ? (boss && combo >= 3 ? 'Верно, серия ×' + combo : 'Верно') : 'Неверно'}</h5>${why ? `<p>${why}</p>` : ''}<p>${q.exp}</p></div>
        ${q.say ? `<div class="say"><b>Сказать на экзамене</b>${q.say}</div>` : ''}
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" id="next">${last ? 'Итог' : 'Дальше'}</button>
        ${q.lab && current.screen !== 'lab' ? `<button class="btn ghost" type="button" id="tolab">Открыть стенд ${lab.no}</button>` : ''}</div>`;
      $('#next', root).onclick = () => { i++; step(); };
      const tl = $('#tolab', root); if (tl) tl.onclick = () => openLab(q.lab, 'bench');
      $('#next', root).focus();
    };
    if (q.t === 'c') {
      const opts = shuffle(q.o);
      ans.innerHTML = `<div class="opts">${opts.map((o, k) => `<button class="opt" type="button" data-k="${k}">${o[0]}</button>`).join('')}</div>`;
      ans.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        const o = opts[+b.dataset.k];
        ans.querySelectorAll('.opt').forEach((x, k) => { x.disabled = true; if (opts[k][1]) x.classList.add('right'); });
        if (!o[1]) b.classList.add('wrong');
        done(!!o[1], o[2]);
      });
    } else {
      ans.innerHTML = `<form class="numrow" id="nf"><input id="num-${q.id}" inputmode="decimal" autocomplete="off" placeholder="число" aria-label="Ответ"><span>${q.unit || ''}</span><button class="btn" type="submit">Проверить</button></form>`;
      const inp = ans.querySelector('input'); inp.focus();
      $('#nf', root).onsubmit = e => {
        e.preventDefault();
        const v = parseFloat(inp.value.replace(',', '.').replace('−', '-'));
        if (isNaN(v)) { toast('Введи число, дробь через запятую или точку'); return; }
        const ok = q.abs !== undefined ? Math.abs(v - q.ans) <= q.abs : Math.abs(v - q.ans) <= Math.abs(q.ans) * q.rel;
        inp.disabled = true; ans.querySelector('button').disabled = true;
        done(ok, ok ? '' : 'Правильный ответ: ' + fmt(q.ans, 3) + ' ' + (q.unit || '') + '.');
      };
    }
  };
  const finish = () => {
    clearInterval(quizTimer);
    const asked = Math.min(order.length, i + (i < order.length ? 1 : 0));
    const share = right / order.length;
    if (labId && !repair) {
      const p = progress.labs[labId], was = p.best >= 0.8;
      if (share > p.best) p.best = share;
      if (share >= 0.8) addXP(30);
      if (!was && p.best >= 0.8) { SND.win(); burst(innerWidth / 2, innerHeight / 3, 60); toast(LABS.find(l => l.id === labId).no + ' под напряжением'); }
      save(); refreshStats();
    }
    let grade = share >= 0.9 ? 'Отлично' : share >= 0.75 ? 'Хорошо' : share >= 0.6 ? 'Удовлетворительно' : 'Ещё разок';
    if (boss) grade = patience <= 0 ? 'Сдано' : life <= 0 ? 'Пересдача' : grade;
    if (boss && patience <= 0) { addXP(50); SND.win(); burst(innerWidth / 2, innerHeight / 3, 80); }
    if (repair) grade = right === order.length ? 'Стенд исправен' : 'Есть что доделать';
    root.innerHTML = `<div class="summary"><span class="eyebrow mono">${title}</span><div class="grade">${grade}</div>
      <p>Верно ${right} из ${boss ? asked : order.length}${lives && life <= 0 ? ', жизни кончились' : ''}${boss ? `, лучшая серия ×${best}${patience <= 0 ? ', экзаменатор сдался досрочно' : ''}` : ''}. ${wrongs.length ? (repair ? 'Выставь эти режимы на стенде и посмотри, что происходит.' : 'Ошибки ушли в работу над ошибками и вернутся завтра.') : 'Без ошибок.'}</p>
      ${wrongs.length ? `<div class="cheat">${wrongs.map(q => `<div class="c"><h5>${LABS.find(l => l.id === q.lab).no}</h5><p>${q.q}</p><span class="f">${q.exp}</span></div>`).join('')}</div>` : ''}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" id="again">Пройти ещё раз</button><button class="btn ghost" type="button" id="tomap">К стендам</button></div></div>`;
    $('#again', root).onclick = () => labId ? openLab(labId, repair ? 'repair' : 'quiz') : boss ? startQuiz(examSet(), 'Экзамен', null, 3) : showReview();
    $('#tomap', root).onclick = showMap;
  };
  if (root === view) current = { screen: 'quiz' };
  step();
}
function showReview() {
  const ids = Object.keys(progress.deck);
  const qs = shuffle(ALLQ.filter(q => ids.includes(q.id)));
  if (!qs.length) {
    current = { screen: 'review' };
    view.innerHTML = `<section class="hero"><h2>Ошибок к повтору нет</h2><p>Сюда попадают вопросы, на которых ты ошибся. Каждый нужно ответить правильно три раза с паузами в 1, 3 и 7 дней.</p></section><button class="btn" type="button" id="tomap">К стендам</button>`;
    $('#tomap').onclick = showMap; return;
  }
  startQuiz(qs, 'Работа над ошибками', null, 0);
}

$('#home').onclick = () => { clearInterval(quizTimer); showMap(); };
$('#review').onclick = () => { clearInterval(quizTimer); showReview(); };
const sndBtn = $('#snd');
const syncSnd = () => { sndBtn.setAttribute('aria-pressed', soundOn); sndBtn.textContent = soundOn ? 'Звук' : 'Без звука'; };
sndBtn.onclick = () => { soundOn = !soundOn; try { localStorage.setItem('eusu-sound', soundOn ? '1' : '0'); } catch (e) {} syncSnd(); if (soundOn) SND.ok(); };
syncSnd();
const rerender = () => { if (lastRender) lastRender(); };
window.addEventListener('resize', rerender);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rerender);
new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.fonts) document.fonts.ready.then(rerender);

const start = data => {
  if (data && data.progress) progress = data.progress;
  refreshStats();
  const h = /^#(lr[2-8])(?:-(quiz|cheat))?$/.exec(location.hash);
  if (data && data.current && data.current.screen === 'lab') openLab(data.current.id, data.current.tab);
  else if (h) openLab(h[1], h[2] || 'bench');
  else if (location.hash === '#exam') startQuiz(examSet(), 'Экзамен', null, 3);
  else showMap();
};
try { window.claude?.hot?.snapshot?.(() => ({ progress, current })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
